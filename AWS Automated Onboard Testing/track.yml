title: '! 26.x AWS Automated Onboard Testing'
description: |-
  Lab Name: 26.x AWS AUTOMATED ONBOARD TESTING

  Outcome:
  Prototype lab automating the AWS onboarding build process to reduce
  wait times, forming the basis of content that may get reused
  elsewhere across 26.x.

  What's automated, hands-free, no learner/instructor action needed:
  AWS infrastructure build, AWS account onboarding to Illumio Cloud,
  Tag-to-Label Mapping (Role, Location), Application Discovery (the
  `crm` app), Deployments (Production/Development), and traffic
  generation (security group rules opening real HTTPS/MySQL traffic,
  a real per-environment web->db MySQL heartbeat every 30s, a VPC Flow
  Log delivering it all to S3). Two deliberate manual steps: Security
  Review (Cloud -> Security Review -> Approve) and CloudSecure's Flow
  Log Access grant (Cloud -> Onboarding -> Flow Log Access).

  **CloudSecure's Flow Log Access grant stays manual** - the actual
  track record (2026-09-07 through 2026-09-09) is that the
  Terraform-automated grant has never once resulted in visible traffic
  (two attempts, 4 hours and 3+ hours, zero both times), while the
  manual Console wizard has succeeded once out of two attempts. This
  was briefly automated on 2026-09-09 on the theory that both methods
  showed equal timing variance; a third live test the same day
  disproved that theory (still zero after 3+ hours). Manual is the
  only method with any confirmed success, so it stays manual until
  that changes. The security group rules and VPC Flow Log delivery to
  S3 are separately 100% reliable and fast (~3 min) - only the grant
  step itself is affected. See the track's README.md for the full
  evidence trail.

  Rough timing: ~20-33 min for onboarding through configuration, then
  another ~10-15 min before it's all visible on the Map - budget up to
  ~50 min total from track start. Traffic flow ingestion (VPC Flow
  Logs -> S3 -> CloudSecure, after the manual Flow Log Access grant)
  is separate and can take anywhere from under an hour to several
  hours, or may not succeed at all on a given attempt - track sized to
  4 hours to allow full margin for this plus time to actually test
  with the resulting traffic afterward.
