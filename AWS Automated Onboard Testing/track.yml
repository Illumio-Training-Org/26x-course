title: '! 26.x AWS Automated Onboard Testing'
description: |-
  Lab Name: 26.x AWS AUTOMATED ONBOARD TESTING

  Outcome:
  Prototype lab automating the AWS onboarding build process to reduce
  wait times, forming the basis of content that may get reused
  elsewhere across 26.x.

  What's automated, hands-free, no learner/instructor action needed:
  AWS infrastructure build, AWS account onboarding to Illumio Cloud,
  Tag-to-Label Mapping (Role, Location), Application Discovery (the
  `crm` app), Deployments (Production/Development), and traffic
  generation (security group rules opening real HTTPS/MySQL traffic,
  a VPC Flow Log delivering it to S3). Two deliberate manual steps:
  Security Review (Cloud -> Security Review -> Approve) and
  CloudSecure's Flow Log Access grant (Cloud -> Onboarding -> Flow
  Log Access).

  **Traffic flow ingestion into CloudSecure is not working, because it
  is disabled on the backend for these ephemeral tenants.** Confirmed
  2026-09-08: both a Terraform-automated Flow Log Access grant and the
  real Console wizard/CFT were tested independently, both produced
  verified-correct AWS-side IAM permissions, and both were silently
  ignored by CloudSecure for hours - not an automation or permissions
  bug on our side. The security group rules and VPC Flow Log itself
  still build and deliver real traffic to S3 automatically, ready for
  ingestion whenever this is fixed on Illumio's end - only the Flow
  Log Access grant step is left out for now. See the track's
  README.md for the full evidence trail.

  Rough timing: ~20-33 min for onboarding through configuration, then
  another ~10-15 min before it's all visible on the Map - budget up to
  ~50 min total from track start. Traffic flow ingestion (VPC Flow
  Logs -> S3 -> CloudSecure) is separate and can take significantly
  longer - track sized to 4 hours to allow full margin for this plus
  time to actually test with the resulting traffic afterward.
